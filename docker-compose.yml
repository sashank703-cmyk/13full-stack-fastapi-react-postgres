services:
 
  db:
    image: postgres:16
    container_name: fastapi-postgres
    restart: always
 
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
 
    volumes:
      - postgres_data:/var/lib/postgresql/data
 
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5
 
    networks:
      - app-network
 
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
 
    container_name: fastapi-backend
    restart: always
 
    env_file:
      - .env
 
    ports:
      - "8000:8000"
 
    depends_on:
      db:
        condition: service_healthy
 
    networks:
      - app-network
 
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
 
    container_name: react-frontend
    restart: always
 
    ports:
      - "80:80"
 
    depends_on:
      - backend
 
    networks:
      - app-network
 
volumes:
  postgres_data:
 
networks:
  app-network:
    driver: bridge
